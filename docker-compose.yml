services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - feedback-data:/data
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    environment:
      - SENTIMENT_API_URL=http://api:8000
    ports:
      - "8501:8501"
    volumes:
      - feedback-data:/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  feedback-data:

<div id="ether-root"></div>
<style>
html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
#ether-root {
  position: fixed; inset: 0; width: 100vw; height: 100vh;
  overflow: hidden; touch-action: none;
  /* color1="#000000": pure black base under the fluid */
  background: #000000;
}
#ether-root canvas { width: 100%; height: 100%; display: block; }
</style>
<script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
<script>
/* LiquidEther — ReactBits component (JS + CSS variant), ported to vanilla JS
   for this Streamlit background frame. Fluid solver: BFECC advection,
   divergence, Poisson pressure solve, velocity-to-palette colouring, with
   an auto-demo pointer driver. Original: https://reactbits.dev */
(function () {
  if (!window.THREE) return; // CDN unavailable -> static gradient fallback
  var THREE = window.THREE;

  // ---- Props (from the ReactBits usage example) ----
  var mouseForce = 20, cursorSize = 100, isViscous = false, viscous = 30,
      iterationsViscous = 32, iterationsPoisson = 32, dt = 0.014, BFECC = true,
      resolution = 0.5, isBounce = false,
      colors = ['#5227FF', '#FF9FFC', '#B497CF'],
      autoDemo = true, autoSpeed = 0.5, autoIntensity = 2.2,
      takeoverDuration = 0.25, autoResumeDelay = 3000, autoRampDuration = 0.6;

  function makePaletteTexture(stops) {
    var arr = (Array.isArray(stops) && stops.length > 0)
      ? (stops.length === 1 ? [stops[0], stops[0]] : stops)
      : ['#ffffff', '#ffffff'];
    var w = arr.length;
    var data = new Uint8Array(w * 4);
    for (var i = 0; i < w; i++) {
      var c = new THREE.Color(arr[i]);
      data[i * 4 + 0] = Math.round(c.r * 255);
      data[i * 4 + 1] = Math.round(c.g * 255);
      data[i * 4 + 2] = Math.round(c.b * 255);
      data[i * 4 + 3] = 255;
    }
    var tex = new THREE.DataTexture(data, w, 1, THREE.RGBAFormat);
    tex.magFilter = THREE.LinearFilter;
    tex.minFilter = THREE.LinearFilter;
    tex.wrapS = THREE.ClampToEdgeWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.generateMipmaps = false;
    tex.needsUpdate = true;
    return tex;
  }

  var paletteTex = makePaletteTexture(colors);
  var bgVec4 = new THREE.Vector4(0, 0, 0, 0); // always transparent

  var Common = {
    width: 0, height: 0, aspect: 1, pixelRatio: 1,
    fboWidth: null, fboHeight: null, time: 0, delta: 0,
    container: null, renderer: null, clock: null,
    init: function (container) {
      this.container = container;
      // Cap at 1 (component default caps at 2): the fluid is inherently soft,
      // and full Retina resolution quadruples the per-frame GPU cost, which
      // makes page scrolling stutter.
      this.pixelRatio = Math.min(window.devicePixelRatio || 1, 1);
      this.resize();
      this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      this.renderer.autoClear = false;
      this.renderer.setClearColor(new THREE.Color(0x000000), 0);
      this.renderer.setPixelRatio(this.pixelRatio);
      this.renderer.setSize(this.width, this.height);
      this.renderer.domElement.style.width = '100%';
      this.renderer.domElement.style.height = '100%';
      this.renderer.domElement.style.display = 'block';
      this.clock = new THREE.Clock();
      this.clock.start();
    },
    resize: function () {
      if (!this.container) return;
      var rect = this.container.getBoundingClientRect();
      this.width = Math.max(1, Math.floor(rect.width));
      this.height = Math.max(1, Math.floor(rect.height));
      this.aspect = this.width / this.height;
      if (this.renderer) this.renderer.setSize(this.width, this.height, false);
    },
    update: function () {
      this.delta = this.clock.getDelta();
      this.time += this.delta;
    }
  };

  var Mouse = {
    mouseMoved: false,
    coords: new THREE.Vector2(),
    coords_old: new THREE.Vector2(),
    diff: new THREE.Vector2(),
    timer: null, container: null,
    isHoverInside: false, hasUserControl: false,
    isAutoActive: false, autoIntensity: 2.0,
    takeoverActive: false, takeoverStartTime: 0, takeoverDuration: 0.25,
    takeoverFrom: new THREE.Vector2(),
    takeoverTo: new THREE.Vector2(),
    onInteract: null,
    init: function (container) {
      this.container = container;
      window.addEventListener('mousemove', this.onDocumentMouseMove.bind(this));
      window.addEventListener('touchstart', this.onDocumentTouchStart.bind(this), { passive: true });
      window.addEventListener('touchmove', this.onDocumentTouchMove.bind(this), { passive: true });
      window.addEventListener('touchend', this.onTouchEnd.bind(this));
      document.addEventListener('mouseleave', this.onDocumentLeave.bind(this));
    },
    isPointInside: function (x, y) {
      if (!this.container) return false;
      var rect = this.container.getBoundingClientRect();
      if (rect.width === 0 || rect.height === 0) return false;
      return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
    },
    updateHoverState: function (x, y) {
      this.isHoverInside = this.isPointInside(x, y);
      return this.isHoverInside;
    },
    setCoords: function (x, y) {
      if (!this.container) return;
      if (this.timer) window.clearTimeout(this.timer);
      var rect = this.container.getBoundingClientRect();
      if (rect.width === 0 || rect.height === 0) return;
      var nx = (x - rect.left) / rect.width;
      var ny = (y - rect.top) / rect.height;
      this.coords.set(nx * 2 - 1, -(ny * 2 - 1));
      this.mouseMoved = true;
      var self = this;
      this.timer = window.setTimeout(function () { self.mouseMoved = false; }, 100);
    },
    setNormalized: function (nx, ny) {
      this.coords.set(nx, ny);
      this.mouseMoved = true;
    },
    onDocumentMouseMove: function (event) {
      if (!this.updateHoverState(event.clientX, event.clientY)) return;
      if (this.onInteract) this.onInteract();
      if (this.isAutoActive && !this.hasUserControl && !this.takeoverActive) {
        var rect = this.container.getBoundingClientRect();
        if (rect.width === 0 || rect.height === 0) return;
        var nx = (event.clientX - rect.left) / rect.width;
        var ny = (event.clientY - rect.top) / rect.height;
        this.takeoverFrom.copy(this.coords);
        this.takeoverTo.set(nx * 2 - 1, -(ny * 2 - 1));
        this.takeoverStartTime = performance.now();
        this.takeoverActive = true;
        this.hasUserControl = true;
        this.isAutoActive = false;
        return;
      }
      this.setCoords(event.clientX, event.clientY);
      this.hasUserControl = true;
    },
    onDocumentTouchStart: function (event) {
      if (event.touches.length !== 1) return;
      var t = event.touches[0];
      if (!this.updateHoverState(t.clientX, t.clientY)) return;
      if (this.onInteract) this.onInteract();
      this.setCoords(t.clientX, t.clientY);
      this.hasUserControl = true;
    },
    onDocumentTouchMove: function (event) {
      if (event.touches.length !== 1) return;
      var t = event.touches[0];
      if (!this.updateHoverState(t.clientX, t.clientY)) return;
      if (this.onInteract) this.onInteract();
      this.setCoords(t.clientX, t.clientY);
    },
    onTouchEnd: function () { this.isHoverInside = false; },
    onDocumentLeave: function () { this.isHoverInside = false; },
    update: function () {
      if (this.takeoverActive) {
        var t = (performance.now() - this.takeoverStartTime) / (this.takeoverDuration * 1000);
        if (t >= 1) {
          this.takeoverActive = false;
          this.coords.copy(this.takeoverTo);
          this.coords_old.copy(this.coords);
          this.diff.set(0, 0);
        } else {
          var k = t * t * (3 - 2 * t);
          this.coords.copy(this.takeoverFrom).lerp(this.takeoverTo, k);
        }
      }
      this.diff.subVectors(this.coords, this.coords_old);
      this.coords_old.copy(this.coords);
      if (this.coords_old.x === 0 && this.coords_old.y === 0) this.diff.set(0, 0);
      if (this.isAutoActive && !this.takeoverActive) this.diff.multiplyScalar(this.autoIntensity);
    }
  };

  function AutoDriver(mouse, manager, opts) {
    this.mouse = mouse;
    this.manager = manager;
    this.enabled = opts.enabled;
    this.speed = opts.speed;
    this.resumeDelay = opts.resumeDelay || 3000;
    this.rampDurationMs = (opts.rampDuration || 0) * 1000;
    this.active = false;
    this.current = new THREE.Vector2(0, 0);
    this.target = new THREE.Vector2();
    this.lastTime = performance.now();
    this.activationTime = 0;
    this.margin = 0.2;
    this._tmpDir = new THREE.Vector2();
    this.pickNewTarget();
  }
  AutoDriver.prototype.pickNewTarget = function () {
    var r = Math.random;
    this.target.set((r() * 2 - 1) * (1 - this.margin), (r() * 2 - 1) * (1 - this.margin));
  };
  AutoDriver.prototype.forceStop = function () {
    this.active = false;
    this.mouse.isAutoActive = false;
  };
  AutoDriver.prototype.update = function () {
    if (!this.enabled) return;
    var now = performance.now();
    var idle = now - this.manager.lastUserInteraction;
    if (idle < this.resumeDelay) { if (this.active) this.forceStop(); return; }
    if (this.mouse.isHoverInside) { if (this.active) this.forceStop(); return; }
    if (!this.active) {
      this.active = true;
      this.current.copy(this.mouse.coords);
      this.lastTime = now;
      this.activationTime = now;
    }
    this.mouse.isAutoActive = true;
    var dtSec = (now - this.lastTime) / 1000;
    this.lastTime = now;
    if (dtSec > 0.2) dtSec = 0.016;
    var dir = this._tmpDir.subVectors(this.target, this.current);
    var dist = dir.length();
    if (dist < 0.01) { this.pickNewTarget(); return; }
    dir.normalize();
    var ramp = 1;
    if (this.rampDurationMs > 0) {
      var t = Math.min(1, (now - this.activationTime) / this.rampDurationMs);
      ramp = t * t * (3 - 2 * t);
    }
    var step = this.speed * dtSec * ramp;
    var move = Math.min(step, dist);
    this.current.addScaledVector(dir, move);
    this.mouse.setNormalized(this.current.x, this.current.y);
  };

  // ---- Shaders (verbatim from the component) ----
  var face_vert = [
    'attribute vec3 position;',
    'uniform vec2 px;',
    'uniform vec2 boundarySpace;',
    'varying vec2 uv;',
    'precision highp float;',
    'void main(){',
    'vec3 pos = position;',
    'vec2 scale = 1.0 - boundarySpace * 2.0;',
    'pos.xy = pos.xy * scale;',
    'uv = vec2(0.5)+(pos.xy)*0.5;',
    'gl_Position = vec4(pos, 1.0);',
    '}'
  ].join('\n');
  var line_vert = [
    'attribute vec3 position;',
    'uniform vec2 px;',
    'precision highp float;',
    'varying vec2 uv;',
    'void main(){',
    'vec3 pos = position;',
    'uv = 0.5 + pos.xy * 0.5;',
    'vec2 n = sign(pos.xy);',
    'pos.xy = abs(pos.xy) - px * 1.0;',
    'pos.xy *= n;',
    'gl_Position = vec4(pos, 1.0);',
    '}'
  ].join('\n');
  var mouse_vert = [
    'precision highp float;',
    'attribute vec3 position;',
    'attribute vec2 uv;',
    'uniform vec2 center;',
    'uniform vec2 scale;',
    'uniform vec2 px;',
    'varying vec2 vUv;',
    'void main(){',
    'vec2 pos = position.xy * scale * 2.0 * px + center;',
    'vUv = uv;',
    'gl_Position = vec4(pos, 0.0, 1.0);',
    '}'
  ].join('\n');
  var advection_frag = [
    'precision highp float;',
    'uniform sampler2D velocity;',
    'uniform float dt;',
    'uniform bool isBFECC;',
    'uniform vec2 fboSize;',
    'uniform vec2 px;',
    'varying vec2 uv;',
    'void main(){',
    'vec2 ratio = max(fboSize.x, fboSize.y) / fboSize;',
    'if(isBFECC == false){',
    'vec2 vel = texture2D(velocity, uv).xy;',
    'vec2 uv2 = uv - vel * dt * ratio;',
    'vec2 newVel = texture2D(velocity, uv2).xy;',
    'gl_FragColor = vec4(newVel, 0.0, 0.0);',
    '} else {',
    'vec2 spot_new = uv;',
    'vec2 vel_old = texture2D(velocity, uv).xy;',
    'vec2 spot_old = spot_new - vel_old * dt * ratio;',
    'vec2 vel_new1 = texture2D(velocity, spot_old).xy;',
    'vec2 spot_new2 = spot_old + vel_new1 * dt * ratio;',
    'vec2 error = spot_new2 - spot_new;',
    'vec2 spot_new3 = spot_new - error / 2.0;',
    'vec2 vel_2 = texture2D(velocity, spot_new3).xy;',
    'vec2 spot_old2 = spot_new3 - vel_2 * dt * ratio;',
    'vec2 newVel2 = texture2D(velocity, spot_old2).xy;',
    'gl_FragColor = vec4(newVel2, 0.0, 0.0);',
    '}',
    '}'
  ].join('\n');
  var color_frag = [
    'precision highp float;',
    'uniform sampler2D velocity;',
    'uniform sampler2D palette;',
    'uniform vec4 bgColor;',
    'varying vec2 uv;',
    'void main(){',
    'vec2 vel = texture2D(velocity, uv).xy;',
    'float lenv = clamp(length(vel), 0.0, 1.0);',
    'vec3 c = texture2D(palette, vec2(lenv, 0.5)).rgb;',
    'vec3 outRGB = mix(bgColor.rgb, c, lenv);',
    'float outA = mix(bgColor.a, 1.0, lenv);',
    'gl_FragColor = vec4(outRGB, outA);',
    '}'
  ].join('\n');
  var divergence_frag = [
    'precision highp float;',
    'uniform sampler2D velocity;',
    'uniform float dt;',
    'uniform vec2 px;',
    'varying vec2 uv;',
    'void main(){',
    'float x0 = texture2D(velocity, uv-vec2(px.x, 0.0)).x;',
    'float x1 = texture2D(velocity, uv+vec2(px.x, 0.0)).x;',
    'float y0 = texture2D(velocity, uv-vec2(0.0, px.y)).y;',
    'float y1 = texture2D(velocity, uv+vec2(0.0, px.y)).y;',
    'float divergence = (x1 - x0 + y1 - y0) / 2.0;',
    'gl_FragColor = vec4(divergence / dt);',
    '}'
  ].join('\n');
  var externalForce_frag = [
    'precision highp float;',
    'uniform vec2 force;',
    'uniform vec2 center;',
    'uniform vec2 scale;',
    'uniform vec2 px;',
    'varying vec2 vUv;',
    'void main(){',
    'vec2 circle = (vUv - 0.5) * 2.0;',
    'float d = 1.0 - min(length(circle), 1.0);',
    'd *= d;',
    'gl_FragColor = vec4(force * d, 0.0, 1.0);',
    '}'
  ].join('\n');
  var poisson_frag = [
    'precision highp float;',
    'uniform sampler2D pressure;',
    'uniform sampler2D divergence;',
    'uniform vec2 px;',
    'varying vec2 uv;',
    'void main(){',
    'float p0 = texture2D(pressure, uv + vec2(px.x * 2.0, 0.0)).r;',
    'float p1 = texture2D(pressure, uv - vec2(px.x * 2.0, 0.0)).r;',
    'float p2 = texture2D(pressure, uv + vec2(0.0, px.y * 2.0)).r;',
    'float p3 = texture2D(pressure, uv - vec2(0.0, px.y * 2.0)).r;',
    'float div = texture2D(divergence, uv).r;',
    'float newP = (p0 + p1 + p2 + p3) / 4.0 - div;',
    'gl_FragColor = vec4(newP);',
    '}'
  ].join('\n');
  var pressure_frag = [
    'precision highp float;',
    'uniform sampler2D pressure;',
    'uniform sampler2D velocity;',
    'uniform vec2 px;',
    'uniform float dt;',
    'varying vec2 uv;',
    'void main(){',
    'float step = 1.0;',
    'float p0 = texture2D(pressure, uv + vec2(px.x * step, 0.0)).r;',
    'float p1 = texture2D(pressure, uv - vec2(px.x * step, 0.0)).r;',
    'float p2 = texture2D(pressure, uv + vec2(0.0, px.y * step)).r;',
    'float p3 = texture2D(pressure, uv - vec2(0.0, px.y * step)).r;',
    'vec2 v = texture2D(velocity, uv).xy;',
    'vec2 gradP = vec2(p0 - p1, p2 - p3) * 0.5;',
    'v = v - gradP * dt;',
    'gl_FragColor = vec4(v, 0.0, 1.0);',
    '}'
  ].join('\n');
  var viscous_frag = [
    'precision highp float;',
    'uniform sampler2D velocity;',
    'uniform sampler2D velocity_new;',
    'uniform float v;',
    'uniform vec2 px;',
    'uniform float dt;',
    'varying vec2 uv;',
    'void main(){',
    'vec2 old = texture2D(velocity, uv).xy;',
    'vec2 new0 = texture2D(velocity_new, uv + vec2(px.x * 2.0, 0.0)).xy;',
    'vec2 new1 = texture2D(velocity_new, uv - vec2(px.x * 2.0, 0.0)).xy;',
    'vec2 new2 = texture2D(velocity_new, uv + vec2(0.0, px.y * 2.0)).xy;',
    'vec2 new3 = texture2D(velocity_new, uv - vec2(0.0, px.y * 2.0)).xy;',
    'vec2 newv = 4.0 * old + v * dt * (new0 + new1 + new2 + new3);',
    'newv /= 4.0 * (1.0 + v * dt);',
    'gl_FragColor = vec4(newv, 0.0, 0.0);',
    '}'
  ].join('\n');

  function ShaderPass(props) {
    this.props = props || {};
    this.uniforms = this.props.material ? this.props.material.uniforms : undefined;
    this.scene = null; this.camera = null;
    this.material = null; this.geometry = null; this.plane = null;
  }
  ShaderPass.prototype.init = function () {
    this.scene = new THREE.Scene();
    this.camera = new THREE.Camera();
    if (this.uniforms) {
      this.material = new THREE.RawShaderMaterial(this.props.material);
      this.geometry = new THREE.PlaneGeometry(2.0, 2.0);
      this.plane = new THREE.Mesh(this.geometry, this.material);
      this.scene.add(this.plane);
    }
  };
  ShaderPass.prototype.update = function () {
    Common.renderer.setRenderTarget(this.props.output || null);
    Common.renderer.render(this.scene, this.camera);
    Common.renderer.setRenderTarget(null);
  };

  function Advection(simProps) {
    ShaderPass.call(this, {
      material: {
        vertexShader: face_vert,
        fragmentShader: advection_frag,
        uniforms: {
          boundarySpace: { value: simProps.cellScale },
          px: { value: simProps.cellScale },
          fboSize: { value: simProps.fboSize },
          velocity: { value: simProps.src.texture },
          dt: { value: simProps.dt },
          isBFECC: { value: true }
        }
      },
      output: simProps.dst
    });
    this.uniforms = this.props.material.uniforms;
    ShaderPass.prototype.init.call(this);
    this.createBoundary();
  }
  Advection.prototype = Object.create(ShaderPass.prototype);
  Advection.prototype.createBoundary = function () {
    var boundaryG = new THREE.BufferGeometry();
    var vertices_boundary = new Float32Array([
      -1, -1, 0, -1, 1, 0, -1, 1, 0, 1, 1, 0, 1, 1, 0, 1, -1, 0, 1, -1, 0, -1, -1, 0
    ]);
    boundaryG.setAttribute('position', new THREE.BufferAttribute(vertices_boundary, 3));
    var boundaryM = new THREE.RawShaderMaterial({
      vertexShader: line_vert,
      fragmentShader: advection_frag,
      uniforms: this.uniforms
    });
    this.line = new THREE.LineSegments(boundaryG, boundaryM);
    this.scene.add(this.line);
  };
  Advection.prototype.update = function (opts) {
    this.uniforms.dt.value = opts.dt;
    this.line.visible = opts.isBounce;
    this.uniforms.isBFECC.value = opts.BFECC;
    ShaderPass.prototype.update.call(this);
  };

  function ExternalForce(simProps) {
    ShaderPass.call(this, { output: simProps.dst });
    ShaderPass.prototype.init.call(this);
    var mouseG = new THREE.PlaneGeometry(1, 1);
    var mouseM = new THREE.RawShaderMaterial({
      vertexShader: mouse_vert,
      fragmentShader: externalForce_frag,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      uniforms: {
        px: { value: simProps.cellScale },
        force: { value: new THREE.Vector2(0.0, 0.0) },
        center: { value: new THREE.Vector2(0.0, 0.0) },
        scale: { value: new THREE.Vector2(simProps.cursor_size, simProps.cursor_size) }
      }
    });
    this.mouse = new THREE.Mesh(mouseG, mouseM);
    this.scene.add(this.mouse);
  }
  ExternalForce.prototype = Object.create(ShaderPass.prototype);
  ExternalForce.prototype.update = function (props) {
    var forceX = (Mouse.diff.x / 2) * props.mouse_force;
    var forceY = (Mouse.diff.y / 2) * props.mouse_force;
    var cursorSizeX = props.cursor_size * props.cellScale.x;
    var cursorSizeY = props.cursor_size * props.cellScale.y;
    var centerX = Math.min(
      Math.max(Mouse.coords.x, -1 + cursorSizeX + props.cellScale.x * 2),
      1 - cursorSizeX - props.cellScale.x * 2
    );
    var centerY = Math.min(
      Math.max(Mouse.coords.y, -1 + cursorSizeY + props.cellScale.y * 2),
      1 - cursorSizeY - props.cellScale.y * 2
    );
    var uniforms = this.mouse.material.uniforms;
    uniforms.force.value.set(forceX, forceY);
    uniforms.center.value.set(centerX, centerY);
    uniforms.scale.value.set(props.cursor_size, props.cursor_size);
    ShaderPass.prototype.update.call(this);
  };

  function Viscous(simProps) {
    ShaderPass.call(this, {
      material: {
        vertexShader: face_vert,
        fragmentShader: viscous_frag,
        uniforms: {
          boundarySpace: { value: simProps.boundarySpace },
          velocity: { value: simProps.src.texture },
          velocity_new: { value: simProps.dst_.texture },
          v: { value: simProps.viscous },
          px: { value: simProps.cellScale },
          dt: { value: simProps.dt }
        }
      },
      output: simProps.dst,
      output0: simProps.dst_,
      output1: simProps.dst
    });
    ShaderPass.prototype.init.call(this);
  }
  Viscous.prototype = Object.create(ShaderPass.prototype);
  Viscous.prototype.update = function (opts) {
    var fbo_in, fbo_out;
    this.uniforms.v.value = opts.viscous;
    for (var i = 0; i < opts.iterations; i++) {
      if (i % 2 === 0) { fbo_in = this.props.output0; fbo_out = this.props.output1; }
      else { fbo_in = this.props.output1; fbo_out = this.props.output0; }
      this.uniforms.velocity_new.value = fbo_in.texture;
      this.props.output = fbo_out;
      this.uniforms.dt.value = opts.dt;
      ShaderPass.prototype.update.call(this);
    }
    return fbo_out;
  };

  function Divergence(simProps) {
    ShaderPass.call(this, {
      material: {
        vertexShader: face_vert,
        fragmentShader: divergence_frag,
        uniforms: {
          boundarySpace: { value: simProps.boundarySpace },
          velocity: { value: simProps.src.texture },
          px: { value: simProps.cellScale },
          dt: { value: simProps.dt }
        }
      },
      output: simProps.dst
    });
    ShaderPass.prototype.init.call(this);
  }
  Divergence.prototype = Object.create(ShaderPass.prototype);
  Divergence.prototype.update = function (opts) {
    this.uniforms.velocity.value = opts.vel.texture;
    ShaderPass.prototype.update.call(this);
  };

  function Poisson(simProps) {
    ShaderPass.call(this, {
      material: {
        vertexShader: face_vert,
        fragmentShader: poisson_frag,
        uniforms: {
          boundarySpace: { value: simProps.boundarySpace },
          pressure: { value: simProps.dst_.texture },
          divergence: { value: simProps.src.texture },
          px: { value: simProps.cellScale }
        }
      },
      output: simProps.dst,
      output0: simProps.dst_,
      output1: simProps.dst
    });
    ShaderPass.prototype.init.call(this);
  }
  Poisson.prototype = Object.create(ShaderPass.prototype);
  Poisson.prototype.update = function (opts) {
    var p_in, p_out;
    for (var i = 0; i < opts.iterations; i++) {
      if (i % 2 === 0) { p_in = this.props.output0; p_out = this.props.output1; }
      else { p_in = this.props.output1; p_out = this.props.output0; }
      this.uniforms.pressure.value = p_in.texture;
      this.props.output = p_out;
      ShaderPass.prototype.update.call(this);
    }
    return p_out;
  };

  function Pressure(simProps) {
    ShaderPass.call(this, {
      material: {
        vertexShader: face_vert,
        fragmentShader: pressure_frag,
        uniforms: {
          boundarySpace: { value: simProps.boundarySpace },
          pressure: { value: simProps.src_p.texture },
          velocity: { value: simProps.src_v.texture },
          px: { value: simProps.cellScale },
          dt: { value: simProps.dt }
        }
      },
      output: simProps.dst
    });
    ShaderPass.prototype.init.call(this);
  }
  Pressure.prototype = Object.create(ShaderPass.prototype);
  Pressure.prototype.update = function (opts) {
    this.uniforms.velocity.value = opts.vel.texture;
    this.uniforms.pressure.value = opts.pressure.texture;
    ShaderPass.prototype.update.call(this);
  };

  function Simulation(options) {
    this.options = Object.assign({
      iterations_poisson: 32,
      iterations_viscous: 32,
      mouse_force: 20,
      resolution: 0.5,
      cursor_size: 100,
      viscous: 30,
      isBounce: false,
      dt: 0.014,
      isViscous: false,
      BFECC: true
    }, options || {});
    this.fbos = {
      vel_0: null, vel_1: null,
      vel_viscous0: null, vel_viscous1: null,
      div: null, pressure_0: null, pressure_1: null
    };
    this.fboSize = new THREE.Vector2();
    this.cellScale = new THREE.Vector2();
    this.boundarySpace = new THREE.Vector2();
    this.init();
  }
  Simulation.prototype.init = function () {
    this.calcSize();
    this.createAllFBO();
    this.createShaderPass();
  };
  Simulation.prototype.getFloatType = function () {
    var isIOS = /(iPad|iPhone|iPod)/i.test(navigator.userAgent);
    return isIOS ? THREE.HalfFloatType : THREE.FloatType;
  };
  Simulation.prototype.createAllFBO = function () {
    var type = this.getFloatType();
    var opts = {
      type: type,
      depthBuffer: false,
      stencilBuffer: false,
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      wrapS: THREE.ClampToEdgeWrapping,
      wrapT: THREE.ClampToEdgeWrapping
    };
    for (var key in this.fbos) {
      this.fbos[key] = new THREE.WebGLRenderTarget(this.fboSize.x, this.fboSize.y, opts);
    }
  };
  Simulation.prototype.createShaderPass = function () {
    this.advection = new Advection({
      cellScale: this.cellScale,
      fboSize: this.fboSize,
      dt: this.options.dt,
      src: this.fbos.vel_0,
      dst: this.fbos.vel_1
    });
    this.externalForce = new ExternalForce({
      cellScale: this.cellScale,
      cursor_size: this.options.cursor_size,
      dst: this.fbos.vel_1
    });
    this.viscous = new Viscous({
      cellScale: this.cellScale,
      boundarySpace: this.boundarySpace,
      viscous: this.options.viscous,
      src: this.fbos.vel_1,
      dst: this.fbos.vel_viscous1,
      dst_: this.fbos.vel_viscous0,
      dt: this.options.dt
    });
    this.divergence = new Divergence({
      cellScale: this.cellScale,
      boundarySpace: this.boundarySpace,
      src: this.fbos.vel_viscous0,
      dst: this.fbos.div,
      dt: this.options.dt
    });
    this.poisson = new Poisson({
      cellScale: this.cellScale,
      boundarySpace: this.boundarySpace,
      src: this.fbos.div,
      dst: this.fbos.pressure_1,
      dst_: this.fbos.pressure_0
    });
    this.pressure = new Pressure({
      cellScale: this.cellScale,
      boundarySpace: this.boundarySpace,
      src_p: this.fbos.pressure_0,
      src_v: this.fbos.vel_viscous0,
      dst: this.fbos.vel_0,
      dt: this.options.dt
    });
  };
  Simulation.prototype.calcSize = function () {
    var width = Math.max(1, Math.round(this.options.resolution * Common.width));
    var height = Math.max(1, Math.round(this.options.resolution * Common.height));
    this.cellScale.set(1.0 / width, 1.0 / height);
    this.fboSize.set(width, height);
  };
  Simulation.prototype.resize = function () {
    this.calcSize();
    for (var key in this.fbos) {
      this.fbos[key].setSize(this.fboSize.x, this.fboSize.y);
    }
  };
  Simulation.prototype.update = function () {
    if (this.options.isBounce) { this.boundarySpace.set(0, 0); }
    else { this.boundarySpace.copy(this.cellScale); }
    this.advection.update({
      dt: this.options.dt,
      isBounce: this.options.isBounce,
      BFECC: this.options.BFECC
    });
    this.externalForce.update({
      cursor_size: this.options.cursor_size,
      mouse_force: this.options.mouse_force,
      cellScale: this.cellScale
    });
    var vel = this.fbos.vel_1;
    if (this.options.isViscous) {
      vel = this.viscous.update({
        viscous: this.options.viscous,
        iterations: this.options.iterations_viscous,
        dt: this.options.dt
      });
    }
    this.divergence.update({ vel: vel });
    var pressure = this.poisson.update({ iterations: this.options.iterations_poisson });
    this.pressure.update({ vel: vel, pressure: pressure });
  };

  function Output() {
    this.simulation = new Simulation();
    this.scene = new THREE.Scene();
    this.camera = new THREE.Camera();
    this.output = new THREE.Mesh(
      new THREE.PlaneGeometry(2, 2),
      new THREE.RawShaderMaterial({
        vertexShader: face_vert,
        fragmentShader: color_frag,
        transparent: true,
        depthWrite: false,
        uniforms: {
          velocity: { value: this.simulation.fbos.vel_0.texture },
          boundarySpace: { value: new THREE.Vector2() },
          palette: { value: paletteTex },
          bgColor: { value: bgVec4 }
        }
      })
    );
    this.scene.add(this.output);
  }
  Output.prototype.resize = function () { this.simulation.resize(); };
  Output.prototype.render = function () {
    Common.renderer.setRenderTarget(null);
    Common.renderer.render(this.scene, this.camera);
  };
  Output.prototype.update = function () {
    this.simulation.update();
    this.render();
  };

  function WebGLManager(props) {
    this.props = props;
    Common.init(props.$wrapper);
    Mouse.init(props.$wrapper);
    Mouse.autoIntensity = props.autoIntensity;
    Mouse.takeoverDuration = props.takeoverDuration;
    this.lastUserInteraction = performance.now();
    var self = this;
    Mouse.onInteract = function () {
      self.lastUserInteraction = performance.now();
      if (self.autoDriver) self.autoDriver.forceStop();
    };
    this.autoDriver = new AutoDriver(Mouse, this, {
      enabled: props.autoDemo,
      speed: props.autoSpeed,
      resumeDelay: props.autoResumeDelay,
      rampDuration: props.autoRampDuration
    });
    props.$wrapper.prepend(Common.renderer.domElement);
    this.output = new Output();
    this._raf = null;
    this.running = false;
    this._loop = this.loop.bind(this);
    window.addEventListener('resize', function () {
      Common.resize();
      self.output.resize();
    });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { self.pause(); } else { self.start(); }
    });
  }
  WebGLManager.prototype.render = function () {
    if (this.autoDriver) this.autoDriver.update();
    Mouse.update();
    Common.update();
    this.output.update();
  };
  WebGLManager.prototype.loop = function () {
    if (!this.running) return;
    this.render();
    this._raf = requestAnimationFrame(this._loop);
  };
  WebGLManager.prototype.start = function () {
    if (this.running) return;
    this.running = true;
    this._loop();
  };
  WebGLManager.prototype.pause = function () {
    this.running = false;
    if (this._raf) { cancelAnimationFrame(this._raf); this._raf = null; }
  };

  var container = document.getElementById('ether-root');
  var webgl = new WebGLManager({
    $wrapper: container,
    autoDemo: autoDemo,
    autoSpeed: autoSpeed,
    autoIntensity: autoIntensity,
    takeoverDuration: takeoverDuration,
    autoResumeDelay: autoResumeDelay,
    autoRampDuration: autoRampDuration
  });
  Object.assign(webgl.output.simulation.options, {
    mouse_force: mouseForce,
    cursor_size: cursorSize,
    isViscous: isViscous,
    viscous: viscous,
    iterations_viscous: iterationsViscous,
    iterations_poisson: iterationsPoisson,
    dt: dt,
    BFECC: BFECC,
    resolution: resolution,
    isBounce: isBounce
  });
  webgl.start();
})();
</script>
